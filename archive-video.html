<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive vidéo — Buzenval</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sources/style.css">
  <style>
    /* Ajustements spécifiques à cette page */
    .video-archive{padding:40px 0}
    .video-archive-grid{display:grid;grid-template-columns:2fr 1fr;gap:24px;align-items:start}
    .main-video video{width:100%;border-radius:12px;background:#000}
    .video-list{display:flex;flex-direction:column;gap:12px;max-height:72vh;overflow:auto}
    .video-item{display:flex;gap:12px;align-items:center;padding:8px;border-radius:8px;cursor:pointer}
    .video-item:hover{background:rgba(0,0,0,.04)}
    .video-thumb{width:120px;height:70px;background:#ddd;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#666;font-size:.9rem}
    .video-meta{flex:1}
    .video-title{font-weight:600}
    @media(max-width:900px){.video-archive-grid{grid-template-columns:1fr}.video-thumb{width:110px;height:66px}}
     /* En-tête pour la page d'archives : éviter une bannière pleine page
       et compenser la barre de navigation fixe */
    .archive-page{ padding-top:64px; }
    .archive-hero{
      height:140px;
      background:
      linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
      url('https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&w=1800&q=80');
      background-size:cover;
      background-position:center;
      display:flex;
      align-items:center;
      color:white;
      padding-top:20px;
      box-sizing:border-box;
    }
    .archive-hero .container h1{ margin-top:0; }
  </style>
</head>
<body>
  <nav>
    <div class="nav-container">
      <a href="index.html" class="logo">Buzenval</a>
      <button class="nav-toggle" aria-label="Ouvrir le menu">☰</button>
      <div class="nav-menu">
        <a href="#accueil">Accueil</a>
        <a href="#histoire">Histoire</a>
        <a href="#patrimoine">Patrimoine</a>
        <a href="#nature">Nature</a>
        <a href="archive-video.html">Archives</a>
        <a href="#contact">Contact</a>
      </div>
    </div>
  </nav>

  <header class="archive-hero">
    <div class="container">
      <h1 style="color:white;margin-top:10px">Archive vidéo</h1>
    </div>
  </header>

  <main class="container video-archive">
    <div class="video-archive-grid">
      <div class="main-video">
        <video id="player" controls>
          <source id="player-source" src="" type="video/mp4">
          Votre navigateur ne supporte pas la vidéo.
        </video>
        <h3 id="player-title" style="margin-top:12px">Sélectionnez une vidéo</h3>
      </div>

      <aside>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h3>Liste des vidéos</h3>
            <small id="count" style="color:var(--text)"></small>
        </div>
        <div id="video-list" class="video-list"></div>
      </aside>

    </div>
  </main>

  <footer>
    <p style="color:#cbd5e1">© 2026 Buzenval</p>
  </footer>

  <script src="sources/archive.js"></script>
  <script>
    // Toggle du menu mobile (petits écrans)
    (function(){
      const btn = document.querySelector('.nav-toggle');
      const menu = document.querySelector('.nav-menu');
      if(!btn || !menu) return;
      btn.addEventListener('click', ()=>{
        menu.classList.toggle('open');
      });
      // fermer le menu si on clique en dehors
      document.addEventListener('click', (e)=>{
        if(!menu.classList.contains('open')) return;
        if(e.target === btn || menu.contains(e.target)) return;
        menu.classList.remove('open');
      });
    })();
  </script>
  
</body>
</html>
